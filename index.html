<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>北海道紅葉狩</title>

  <!-- iOS Web App Capable Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="北海道紅葉狩">
  <link rel="apple-touch-icon" href="https://jacquelyn-2026.github.io/Hokkaido-2026/apple-touch-icon.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',  
              100: '#ffedd5', 
              200: '#fed7aa', 
              300: '#fdba74', 
              400: '#fb923c', 
              500: '#ea580c', 
              600: '#c2410c', 
              700: '#9a3412', 
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #fdf8f6;
      -webkit-tap-highlight-color: transparent;
    }
    .editable-input {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #fed7aa;
      border-radius: 8px;
      padding: 6px 10px;
      width: 100%;
      font-size: 13px;
    }
    .editable-input:focus {
      outline: 2px solid #ea580c;
      border-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulse-highlight {
      0%, 100% { background-color: rgba(254, 215, 170, 0.3); border-color: #f97316; }
      50% { background-color: rgba(251, 146, 60, 0.4); border-color: #ea580c; }
    }
    .highlight-card {
      animation: pulse-highlight 1.5s ease-in-out 2;
    }

    /* Dynamic font size classes */
    .app-text-sm {
      font-size: 13px;
    }
    .app-text-lg {
      font-size: 15px;
    }
    .app-text-sm .card-title { font-size: 14px; }
    .app-text-lg .card-title { font-size: 17px; }
    .app-text-sm .card-desc { font-size: 12px; }
    .app-text-lg .card-desc { font-size: 14px; }
    .app-text-sm .card-sub { font-size: 11px; }
    .app-text-lg .card-sub { font-size: 13px; }
  </style>
</head>

<body class="text-slate-800 antialiased font-sans pb-28 min-h-screen" x-data="tripApp()" :class="textSize === 'large' ? 'app-text-lg' : 'app-text-sm'">

  <!-- 頂部 Header -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-orange-100 px-4 py-3 shadow-sm flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🍁</span>
      <h1 class="text-base font-bold text-brand-700 tracking-tight">北海道紅葉狩</h1>
    </div>
    <div class="flex items-center gap-2">
      <!-- 字體大小切換按鈕 -->
      <button @click="toggleTextSize()" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full flex items-center gap-1 border border-amber-200 transition-colors">
        <i class="fa-solid fa-text-height text-amber-600"></i>
        <span x-text="textSize === 'large' ? '文字：大' : '文字：小'"></span>
      </button>

      <button @click="showModal = true" class="text-xs bg-brand-50 text-brand-600 hover:bg-brand-100 font-medium px-2.5 py-1 rounded-full flex items-center gap-1 border border-brand-200">
        <i class="fa-solid fa-circle-question"></i>
        <span>說明</span>
      </button>
    </div>
  </header>

  <!-- 主要內容 View -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- 1. 所有計畫 (Overview) -->
    <div x-show="currentTab === 'plans'" x-transition:enter="transition ease-out duration-200" class="space-y-4">
      <div class="bg-gradient-to-br from-brand-500 via-brand-600 to-amber-800 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
        <div class="absolute -right-4 -bottom-4 text-white/15 text-8xl font-black">🍁</div>
        <span class="inline-block bg-white/20 backdrop-blur-md text-xs font-semibold px-2.5 py-1 rounded-full mb-2">旅行計畫</span>
        <h2 class="text-2xl font-bold mb-1" x-text="tripTitle"></h2>
        <p class="text-orange-100 card-desc mb-4">秋季賞楓與美食深度巡禮 (8天7夜)</p>

        <div class="grid grid-cols-2 gap-2 card-desc bg-white/15 rounded-xl p-3 backdrop-blur-sm border border-white/10">
          <div>
            <span class="text-orange-100 block card-sub">旅行日期</span>
            <span class="font-bold">2026/11/03 - 11/10</span>
          </div>
          <div>
            <span class="text-orange-100 block card-sub">同行成員</span>
            <span class="font-bold">Man, Amy, Kenny, Jacquelyn</span>
          </div>
        </div>
      </div>

      <!-- 團友通知事項 (第一頁) -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-3">
        <div class="flex justify-between items-center border-b border-orange-100/60 pb-2">
          <div>
            <h3 class="font-bold text-slate-800 card-title flex items-center gap-1.5">
              <i class="fa-solid fa-note-sticky text-amber-500"></i> 團友通知事項
            </h3>
            <p class="card-sub text-slate-400 mt-0.5">成員溫馨提示與注意事項卡片</p>
          </div>
          <button @click="addNotice()" class="bg-brand-500 hover:bg-brand-600 text-white font-bold px-2.5 py-1 rounded-xl text-xs flex items-center gap-1 transition-colors shadow-sm">
            <i class="fa-solid fa-plus"></i>
            <span>新增卡片</span>
          </button>
        </div>

        <!-- Flash Cards List -->
        <div class="space-y-3">
          <template x-for="(n, index) in notices" :key="n.id">
            <div class="bg-gradient-to-br from-amber-50/90 to-orange-50/90 rounded-2xl p-3.5 shadow-sm border border-amber-200 relative space-y-2">
              <div class="flex justify-between items-start">
                <span class="card-sub bg-amber-200/60 text-amber-900 font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                  <i class="fa-solid fa-bullhorn text-[9px]"></i>
                  <span x-text="n.date"></span>
                </span>
                <div class="flex items-center gap-2">
                  <button @click="n.isEditing = !n.isEditing" class="text-slate-400 hover:text-brand-600 text-xs p-1">
                    <i class="fa-solid" :class="n.isEditing ? 'fa-check text-green-600' : 'fa-pen-to-square'"></i>
                  </button>
                  <button @click="deleteNotice(n.id)" class="text-slate-400 hover:text-red-600 text-xs p-1">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>

              <!-- 卡片內容：正常顯示 vs 編輯模式 -->
              <template x-if="!n.isEditing">
                <div>
                  <h4 class="font-bold text-slate-800 card-title mb-1" x-text="n.title"></h4>
                  <p class="card-desc text-slate-700 leading-relaxed whitespace-pre-line" x-text="n.content"></p>
                </div>
              </template>

              <template x-if="n.isEditing">
                <div class="space-y-2 card-desc pt-1">
                  <div>
                    <label class="card-sub text-slate-400 block font-semibold mb-0.5">標題</label>
                    <input type="text" x-model="n.title" @input="saveToLocalStorage()" class="editable-input font-bold">
                  </div>
                  <div>
                    <label class="card-sub text-slate-400 block font-semibold mb-0.5">通知內容</label>
                    <textarea x-model="n.content" @input="saveToLocalStorage()" rows="3" class="editable-input"></textarea>
                  </div>
                  <button @click="n.isEditing = false" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-1.5 rounded-lg text-xs transition-colors">
                    完成編輯
                  </button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- 每日行程總覽 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-3">
        <div class="flex justify-between items-center border-b border-orange-100/60 pb-2">
          <h3 class="font-bold text-slate-800 card-title flex items-center gap-1.5">
            <i class="fa-solid fa-route text-brand-500"></i> 每日行程總覽 (8天7夜)
          </h3>
          <span class="text-xs text-brand-600 font-medium cursor-pointer hover:underline" @click="currentTab = 'itinerary'">完整行程 &rarr;</span>
        </div>

        <div class="space-y-2 card-desc">
          <template x-for="(day, index) in itinerary" :key="index">
            <div class="p-3 rounded-xl bg-orange-50/60 hover:bg-orange-100/50 transition-colors cursor-pointer border border-orange-100" @click="currentTab = 'itinerary'; selectDay(index)">
              <div class="flex items-center justify-between font-semibold text-brand-700 mb-1">
                <span x-text="`Day ${day.dayNum} (${day.date})`"></span>
                <span class="card-sub text-slate-500 font-normal flex items-center gap-1 bg-white/80 px-2 py-0.5 rounded-md border border-orange-100">
                  <i class="fa-solid fa-bed text-brand-400"></i>
                  <span x-text="day.hotelShort"></span>
                </span>
              </div>
              <p class="text-slate-600 card-desc line-clamp-1" x-text="day.mainTheme"></p>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- 2. 全部行程 (Itinerary) -->
    <div x-show="currentTab === 'itinerary'" x-transition:enter="transition ease-out duration-200" class="space-y-4">
      <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
        <template x-for="(day, index) in itinerary" :key="index">
          <button 
            @click="activeDayIndex = index"
            :class="activeDayIndex === index ? 'bg-brand-500 text-white shadow-md' : 'bg-white text-slate-600 border border-orange-200'"
            class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-center min-w-[72px]">
            <div x-text="`Day ${day.dayNum}`"></div>
            <div class="text-[10px] opacity-80" x-text="day.dateShort"></div>
          </button>
        </template>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-orange-100 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold px-2 py-0.5 rounded bg-brand-100 text-brand-700" x-text="`Day ${itinerary[activeDayIndex].dayNum} • ${itinerary[activeDayIndex].date}`"></span>
          <div class="flex items-center gap-2">
            <button @click="exportDayItinerary(activeDayIndex)" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 transition-colors">
              <i class="fa-solid fa-share-nodes"></i>
              <span>分享此日行程</span>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <h2 class="text-base font-bold text-slate-800" x-text="itinerary[activeDayIndex].title"></h2>
          <!-- 按鈕點擊可直達並高亮對應酒店頁面卡片 -->
          <button @click="goToHotel(itinerary[activeDayIndex].hotel)" class="text-xs text-brand-600 bg-brand-50 hover:bg-brand-100 px-2 py-1 rounded-lg border border-brand-200 transition-colors flex items-center gap-1 font-semibold">
            <i class="fa-solid fa-hotel text-brand-500"></i>
            <span x-text="itinerary[activeDayIndex].hotel"></span>
          </button>
        </div>
        <p class="card-desc text-slate-500 mt-0.5" x-text="itinerary[activeDayIndex].mainTheme"></p>
      </div>

      <div class="relative pl-4 border-l-2 border-brand-300 space-y-4 my-2">
        <template x-for="(item, itemIdx) in itinerary[activeDayIndex].items" :key="itemIdx">
          <div class="relative bg-white rounded-2xl p-3.5 shadow-sm border border-orange-100">
            <div class="absolute -left-[23px] top-4 w-3.5 h-3.5 rounded-full bg-brand-500 border-2 border-white shadow-sm"></div>

            <!-- 一般顯示模式 -->
            <div class="flex items-start justify-between gap-2">
              <div class="flex-1 cursor-pointer" @click="toggleItemExpand(activeDayIndex, itemIdx)">
                <div class="flex flex-wrap items-center gap-1.5 mb-1">
                  <span class="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded" x-text="item.time"></span>
                  <template x-if="item.isKey">
                    <span class="card-sub bg-red-100 text-red-700 font-bold px-1.5 py-0.5 rounded flex items-center gap-1">
                      <i class="fa-solid fa-leaf text-red-600"></i> 景點
                    </span>
                  </template>
                  <template x-if="item.isZoo">
                    <span class="card-sub bg-sky-100 text-sky-700 font-bold px-1.5 py-0.5 rounded flex items-center gap-1">
                      <i class="fa-solid fa-kiwi-bird"></i> 動物園
                    </span>
                  </template>
                  <template x-if="item.bookingCode">
                    <button @click.stop="goToBooking(item.title)" class="card-sub bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-2 py-0.5 rounded flex items-center gap-1 border border-amber-300 transition-colors">
                      <i class="fa-solid fa-ticket"></i> 檢視預約
                    </button>
                  </template>
                  <span class="card-sub text-slate-400 ml-auto font-medium" x-text="item.expanded ? '▲ 收起詳細' : '▼ 檢視'"></span>
                </div>

                <h3 class="font-bold card-title text-slate-800" x-text="item.title"></h3>
                <p class="card-desc text-slate-500 mt-0.5 leading-relaxed" x-text="item.desc"></p>
                <template x-if="item.note">
                  <p class="card-sub text-amber-700 bg-amber-50 px-2 py-1 rounded-md mt-1 font-medium border border-amber-100 inline-block" x-text="`💡 ${item.note}`"></p>
                </template>
              </div>

              <!-- 右側按鈕區域：地圖按鈕與介紹按鈕 -->
              <div class="flex flex-col gap-1.5 flex-shrink-0">
                <template x-if="item.location">
                  <button @click="openGoogleMap(item.location)" class="bg-brand-50 text-brand-600 hover:bg-brand-100 p-1.5 rounded-xl text-xs flex flex-col items-center justify-center gap-0.5 w-12 h-11 transition-colors border border-brand-100">
                    <i class="fa-solid fa-map-location-dot text-xs"></i>
                    <span class="card-sub font-bold">地圖</span>
                  </button>
                </template>

                <!-- 介紹連結按鈕 (如果設置了 website) -->
                <template x-if="item.website">
                  <button @click="openExternalUrl(item.website)" class="bg-amber-50 text-amber-700 hover:bg-amber-100 p-1.5 rounded-xl text-xs flex flex-col items-center justify-center gap-0.5 w-12 h-11 transition-colors border border-amber-200">
                    <i class="fa-solid fa-circle-info text-xs"></i>
                    <span class="card-sub font-bold">介紹</span>
                  </button>
                </template>
              </div>
            </div>

            <!-- 展開後的詳細資訊與編輯表單 -->
            <div x-show="item.expanded" x-transition class="mt-3 pt-3 border-t border-orange-100 space-y-3 bg-orange-50/30 p-3 rounded-xl">
              <div class="card-desc font-bold text-brand-700 flex items-center gap-1">
                <i class="fa-solid fa-pen-to-square"></i> 編輯此行程項目
              </div>
              <div class="grid grid-cols-2 gap-2 card-desc">
                <div>
                  <label class="card-sub text-slate-400 block font-semibold mb-0.5">時間</label>
                  <input type="text" x-model="item.time" @input="saveToLocalStorage()" class="editable-input">
                </div>
                <div>
                  <label class="card-sub text-slate-400 block font-semibold mb-0.5">預約編號</label>
                  <input type="text" x-model="item.bookingCode" @input="saveToLocalStorage()" placeholder="無則留空" class="editable-input font-mono">
                </div>
              </div>
              <div class="card-desc">
                <label class="card-sub text-slate-400 block font-semibold mb-0.5">標題</label>
                <input type="text" x-model="item.title" @input="saveToLocalStorage()" class="editable-input font-bold">
              </div>
              <div class="card-desc">
                <label class="card-sub text-slate-400 block font-semibold mb-0.5">詳細說明 / 描述</label>
                <textarea x-model="item.desc" @input="saveToLocalStorage()" rows="2" class="editable-input"></textarea>
              </div>
              <div class="card-desc">
                <label class="card-sub text-slate-400 block font-semibold mb-0.5">備註 / 提示</label>
                <input type="text" x-model="item.note" @input="saveToLocalStorage()" placeholder="例如：票價、注意事項" class="editable-input">
              </div>
              <div class="card-desc">
                <label class="card-sub text-slate-400 block font-semibold mb-0.5">地圖搜尋地名 (留空則不顯示地圖按鈕)</label>
                <input type="text" x-model="item.location" @input="saveToLocalStorage()" placeholder="例如：新千歲機場" class="editable-input">
              </div>
              <div class="card-desc">
                <label class="card-sub text-slate-400 block font-semibold mb-0.5">介紹連結網址 (留空則不顯示介紹按鈕)</label>
                <input type="text" x-model="item.website" @input="saveToLocalStorage()" placeholder="https://..." class="editable-input font-mono">
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- 3. 預約資訊 (Bookings) -->
    <div x-show="currentTab === 'bookings'" x-transition:enter="transition ease-out duration-200" class="space-y-3">
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex items-center gap-2.5 text-amber-900 card-desc">
        <i class="fa-solid fa-ticket text-amber-600 text-lg flex-shrink-0"></i>
        <span>所有餐廳與活動預約資訊均整理於此。</span>
      </div>

      <template x-for="(b, bIdx) in bookings" :key="bIdx">
        <div :id="`booking-${b.id}`" class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-2 transition-all duration-300">
          <div class="flex justify-between items-start">
            <div>
              <span class="card-sub bg-brand-100 text-brand-700 font-bold px-2 py-0.5 rounded" x-text="b.category"></span>
              <h3 class="font-bold text-slate-800 card-title mt-1" x-text="b.title"></h3>
            </div>
            
            <!-- 右側按鈕區域：地圖與確認信按鈕 -->
            <div class="flex flex-col gap-1.5 flex-shrink-0 items-end">
              <template x-if="b.location">
                <button @click="openGoogleMap(b.location)" class="bg-brand-50 hover:bg-brand-100 text-brand-600 border border-brand-200 px-2.5 py-1 rounded-lg text-xs flex items-center gap-1 font-semibold transition-colors">
                  <i class="fa-solid fa-location-dot"></i>
                  <span>地圖</span>
                </button>
              </template>
              <template x-if="b.confirmationUrl">
                <button @click="openExternalUrl(b.confirmationUrl)" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-1 rounded-lg text-xs flex items-center gap-1 font-bold transition-colors shadow-sm">
                  <i class="fa-solid fa-file-contract text-amber-600"></i>
                  <span>確認信</span>
                </button>
              </template>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 card-desc text-slate-600 bg-orange-50/40 p-2.5 rounded-xl">
            <div><span class="text-slate-400">日期：</span><span class="font-medium" x-text="b.date"></span></div>
            <div><span class="text-slate-400">時間：</span><span class="font-medium" x-text="b.time"></span></div>
            <div class="col-span-2"><span class="text-slate-400">預約號碼：</span><span class="font-bold text-amber-700 font-mono" x-text="b.code || '現場安排'"></span></div>
            <template x-if="b.content">
              <div class="col-span-2"><span class="text-slate-400">預約內容：</span><span class="font-medium text-slate-700" x-text="b.content"></span></div>
            </template>
          </div>

          <template x-if="b.notice">
            <p class="card-sub text-amber-800 bg-amber-50 px-2.5 py-1.5 rounded-lg border border-amber-100 font-medium" x-text="`💡 ${b.notice}`"></p>
          </template>
        </div>
      </template>
    </div>

    <!-- 4. 酒店資訊 (Hotels) -->
    <div x-show="currentTab === 'hotels'" x-transition:enter="transition ease-out duration-200" class="space-y-3">
      <template x-for="(h, hIdx) in hotels" :key="hIdx">
        <div :id="`hotel-${h.id}`" class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-2 transition-all duration-300">
          <div class="flex justify-between items-start">
            <div>
              <span class="card-sub bg-brand-100 text-brand-700 font-bold px-2 py-0.5 rounded" x-text="h.nights"></span>
              <h3 class="font-bold text-slate-800 card-title mt-1" x-text="h.nameZh"></h3>
              <p class="card-desc text-slate-400 font-serif" x-text="h.namejp"></p>
            </div>
            
            <!-- 右側地圖與確認信按鈕 -->
            <div class="flex flex-col gap-1.5 flex-shrink-0 items-end">
              <template x-if="h.address">
                <button @click="openGoogleMap(h.address)" class="bg-brand-50 hover:bg-brand-100 text-brand-600 border border-brand-200 px-2.5 py-1 rounded-lg text-xs flex items-center gap-1 font-semibold transition-colors">
                  <i class="fa-solid fa-map-pin"></i>
                  <span>地圖</span>
                </button>
              </template>
              
              <!-- 確認信按鈕 (若設置 confirmationUrl) -->
              <template x-if="h.confirmationUrl">

  <!-- JS Alpine App Logic -->
  <script>
    function tripApp() {
      return {
        currentTab: 'plans',
        tripTitle: '北海道紅葉狩 8天7夜深度遊',
        activeDayIndex: 0,
        showModal: false,
        textSize: 'small', // 'small' | 'large'

        exchangeRate: 20.0,
        members: ['Man', 'Amy', 'Kenny', 'Jacquelyn'],
        expenses: [],

        notices: [
          {
            id: 1,
            title: '團友行前溫馨提示 🍁',
            date: '2026/11/03',
            content: '多謝大家抽空一齊去北海道玩！今次旅行主打輕鬆自由，我哋安排咗包車遊，隨停隨走無壓力～ 途中有想去嘅景點、打卡位或者想試嘅美食，隨時講聲，只要順路或者方便，行程可以隨時彈性調整！希望大家玩得開心！',
            isEditing: false
          }
        ],

        newExpense: {
          date: new Date().toISOString().split('T')[0],
          title: '',
          amount: null,
          currency: 'JPY',
          payer: 'Man'
        },

        toggleTextSize() {
          this.textSize = this.textSize === 'small' ? 'large' : 'small';
          this.saveToLocalStorage();
        },

        toggleItemExpand(dayIdx, targetItemIdx) {
          const currentItems = this.itinerary[dayIdx].items;
          const isCurrentlyExpanded = currentItems[targetItemIdx].expanded;

          // 自動關閉同一個 Day 中的所有其他展開卡片
          currentItems.forEach((item, idx) => {
            item.expanded = (idx === targetItemIdx) ? !isCurrentlyExpanded : false;
          });
        },

        initLocalStorage() {
          const savedData = localStorage.getItem('hokkaido_trip_local_data');
          if (savedData) {
            try {
              const data = JSON.parse(savedData);
              if (data.itinerary) this.itinerary = data.itinerary;
              if (data.bookings) this.bookings = data.bookings;
              if (data.hotels) this.hotels = data.hotels;
              if (data.expenses) this.expenses = data.expenses;
              if (data.members) this.members = data.members;
              if (data.exchangeRate) this.exchangeRate = data.exchangeRate;
              if (data.notices) this.notices = data.notices;
              if (data.textSize) this.textSize = data.textSize;
            } catch (e) {
              console.error('Failed to load local storage', e);
            }
          }
        },

        saveToLocalStorage() {
          const data = {
            itinerary: this.itinerary,
            bookings: this.bookings,
            hotels: this.hotels,
            expenses: this.expenses,
            members: this.members,
            exchangeRate: this.exchangeRate,
            notices: this.notices,
            textSize: this.textSize
          };
          localStorage.setItem('hokkaido_trip_local_data', JSON.stringify(data));
        },

        selectDay(index) {
          this.activeDayIndex = index;
        },

        // 跳轉至酒店頁面並高亮對應卡片
        goToHotel(hotelName) {
          if (!hotelName || hotelName === '溫暖的家' || hotelName === '賦歸' || hotelName === '回家') return;
          this.currentTab = 'hotels';
          let match = null;
          if (hotelName.includes('Granbell') || hotelName.includes('granbell') || hotelName.includes('狸小路')) {
            match = this.hotels.find(h => h.id === 'h4');
          } else if (hotelName.includes('ESCON') || hotelName.includes('EsCON') || hotelName.includes('escon')) {
            match = this.hotels.find(h => h.id === 'h5');
          } else {
            match = this.hotels.find(h => hotelName.includes(h.nameZh) || h.nameZh.includes(hotelName));
          }
          if (match) {
            this.$nextTick(() => {
              const el = document.getElementById(`hotel-${match.id}`);
              if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('highlight-card');
                setTimeout(() => el.classList.remove('highlight-card'), 3000);
              }
            });
          }
        },

        // 跳轉至預約資訊頁面並對應高亮顯示
        goToBooking(itemTitle) {
          this.currentTab = 'bookings';
          const match = this.bookings.find(b => itemTitle.includes(b.title) || b.title.includes(itemTitle));
          if (match) {
            this.$nextTick(() => {
              const el = document.getElementById(`booking-${match.id}`);
              if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('highlight-card');
                setTimeout(() => el.classList.remove('highlight-card'), 3000);
              }
            });
          }
        },

        addNotice() {
          const newCard = {
            id: Date.now(),
            title: '新通知備忘',
            date: new Date().toISOString().split('T')[0],
            content: '請在此輸入通知內容...',
            isEditing: true
          };
          this.notices.unshift(newCard);
          this.saveToLocalStorage();
        },

        deleteNotice(id) {
          if (confirm('確定要刪除此卡片嗎？')) {
            this.notices = this.notices.filter(n => n.id !== id);
            this.saveToLocalStorage();
          }
        },

        openGoogleMap(locationName) {
          if (!locationName) return;
          const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locationName)}`;
          window.open(url, '_blank');
        },

        openExternalUrl(url) {
          if (!url) return;
          window.open(url, '_blank');
        },

        exportDayItinerary(dayIndex) {
          const day = this.itinerary[dayIndex];
          if (!day) return;

          let text = `🍁【Day ${day.dayNum} 行程安排 - ${day.date}】\n`;
          text += `主題：${day.mainTheme}\n`;
          text += `住宿：${day.hotel}\n`;
          text += `------------------------------\n`;

          day.items.forEach((item) => {
            text += `📌 ${item.time} | ${item.title}\n`;
            if (item.desc) text += `   💬 ${item.desc}\n`;
            if (item.note) text += `   💡 備註: ${item.note}\n`;
            if (item.bookingCode) text += `   🎫 預約編號: ${item.bookingCode}\n`;
            text += `\n`;
          });

          text += `------------------------------\n`;
          text += `祝今日旅途愉快！✨`;

          navigator.clipboard.writeText(text).then(() => {
            alert(`Day ${day.dayNum} 行程已成功複製到剪貼簿！`);
          }).catch(() => {
            alert(text);
          });
        },

        updateMembers(inputStr) {
          const newM = inputStr.split(',').map(s => s.trim()).filter(Boolean);
          if (newM.length > 0) {
            this.members = newM;
            this.newExpense.payer = newM[0];
            this.saveToLocalStorage();
          }
        },

        addExpense() {
          if (!this.newExpense.title || !this.newExpense.amount) {
            alert('請填寫完整項目名稱與金額！');
            return;
          }
          const expenseObj = {
            id: Date.now(),
            date: this.newExpense.date,
            title: this.newExpense.title,
            amount: parseFloat(this.newExpense.amount),
            currency: this.newExpense.currency,
            payer: this.newExpense.payer
          };
          this.expenses.unshift(expenseObj);
          this.newExpense.title = '';
          this.newExpense.amount = null;
          this.saveToLocalStorage();
        },

        deleteExpense(id) {
          if (confirm('確定要刪除這筆帳目嗎？')) {
            this.expenses = this.expenses.filter(e => e.id !== id);
            this.saveToLocalStorage();
          }
        },

        init() {
          this.initLocalStorage();
        },

        itinerary: [
          {
            dayNum: 1, date: '11/3 (週二)', dateShort: '11/03', title: '抵達與長途南下', mainTheme: '抵達北海道，搭乘專車沿海岸線南下前往函館。', hotel: 'OMO5 函館', hotelShort: 'OMO5 函館',
            items: [
              { time: '09:10 - 14:50', title: '香港國際機場前往日本北海道新千歲機場✈️', desc: '航班 CX580，行程 5 小時 5 分鐘。', location: '', isKey: false, isZoo: false, expanded: false },
              { time: '15:00 - 16:00', title: '抵達新千歲機場✈️，入境手續，準備前往函館', desc: '長途車程約 3.5 小時。💡 建議於機場購買飯糰、炸雞於車上享用。司導資料後補。', location: '新千歲機場國際線', isKey: false, isZoo: false, expanded: false },
              { time: '16:00 - 17:00', title: '機場會合，出發前往函館', desc: '車程約 1 小時，先前往有珠山服務區。', location: '有珠山服務區 (上行)', isKey: false, isZoo: false, expanded: false },
              { time: '17:00 - 18:00', title: '【晚餐】有珠山服務區 (SA)', desc: '停留 1 小時。下車伸展筋骨並享用晚餐（推薦特產蟹肉飯）。', location: '有珠山服務區 (上行)', website: 'https://tc.tabirai.net/sightseeing/article/highway-hokkaido-5/', isKey: false, isZoo: false, expanded: false },
              { time: '18:00 - 20:30', title: '前往函館市區', desc: '長途車程約 2.5 小時。沿噴火灣夜間南下，在車上舒適休息。', location: 'OMO5 函館', isKey: false, isZoo: false, expanded: false },
              { time: '20:30', title: '入住 OMO5 函館', desc: '辦理 Check-in，享受星野集團懷舊港町氛圍與設施。', location: 'OMO5 函館 by Hoshino Resorts', note: '', isKey: false, isZoo: false, expanded: false }
            ]
          },
          {
            dayNum: 2, date: '11/4 (週三)', dateShort: '11/04', title: '函館港町浪漫與紅葉名所', mainTheme: '暢遊函館三大賞楓名所、品嚐頂級海膽與和牛壽喜燒、專車直上函館山賞夜景。', hotel: 'OMO5 函館', hotelShort: 'OMO5 函館',
            items: [
              { time: '09:00 - 09:45', title: '酒店早餐', desc: '於 OMO5 享用精緻晨光早餐。', location: '', isKey: false, isZoo: false, expanded: false },
              { time: '10:00 - 10:10', title: '出發前往五稜郭公園', desc: '車程 10 分鐘。', location: '五稜郭公園', isKey: false, isZoo: false, expanded: false },
              { time: '10:10 - 11:15', title: '五稜郭公園', desc: '停留 1 小時。漫步護城河畔賞紅葉，可登塔俯瞰星形城堡。', location: '五稜郭公園', website: 'https://www.visit-hokkaido.jp/tw/spot/detail_10034.html', note: '未買展望塔門票，JPY 1,200/ppl。', isKey: true, isZoo: false, expanded: false },
